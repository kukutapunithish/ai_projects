[project]
name = "support_chatbot"
version = "0.1.0"
description = "A chatbot to converse for any usecase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel",
    "uv",
    "requests",
    "ollama",
    "pyyaml",
    "streamlit"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
runchat = "my_app.main:run_app"